<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador PDE 2026 | SME SP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .help-icon {
            cursor: pointer; color: #0056b3; font-weight: bold; border: 1px solid #0056b3;
            border-radius: 50%; width: 22px; height: 22px; display: inline-flex;
            align-items: center; justify-content: center; margin-left: 8px; transition: all 0.2s;
            font-size: 12px; background: white;
        }
        .help-icon:hover { background-color: #0056b3; color: white; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        #results-details { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        #results-bar.is-expanded #results-details { max-height: 1000px; }
        #toggle-icon { transition: transform 0.3s; }
        #results-bar.is-expanded #toggle-icon { transform: rotate(180deg); }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
        th, td { border: 1px solid #e2e8f0; padding: 6px; text-align: center; }
        th { background-color: #f8fafc; color: #64748b; text-transform: uppercase; }
    </style>
</head>
<body class="pb-72">

    <header class="bg-[#003562] text-white p-5 shadow-lg border-b-4 border-[#fbbf24]">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl md:text-2xl font-black tracking-tighter uppercase">Simulador PDE 2026</h1>
                <p class="text-[10px] md:text-xs text-blue-200 uppercase tracking-widest mt-1 font-medium font-bold">Secretaria Municipal de Educação</p>
            </div>
            <img src="https://sme-upge.github.io/pde-2025/logo-sme.png" alt="SME" class="h-10 md:h-14 w-auto">
        </div>
    </header>

    <main class="p-4 md:p-8 max-w-5xl mx-auto">
        <!-- PERFIL -->
        <div class="bg-blue-50 p-6 rounded-2xl mb-8 border border-blue-100 shadow-inner grid grid-cols-1 md:grid-cols-3 gap-6 text-sm">
            <div>
                <label class="block font-bold text-blue-900 mb-2 uppercase text-[10px]">Seu Cargo</label>
                <select id="cargo" class="w-full p-3 rounded-xl border-none shadow-sm font-semibold text-slate-700">
                    <option value="professor">Professor(a)</option>
                    <option value="diretor">Diretor(a) de Escola</option>
                    <option value="assistente_diretor">Assistente de Diretor(a)</option>
                    <option value="coordenador">Coordenador(a) Pedagógico(a)</option>
                    <option value="supervisor" selected>Supervisor(a) Escolar</option>
                    <option value="outros_cargos">ATE / Agente Escolar / Outros</option>
                </select>
            </div>
            <div>
                <label class="block font-bold text-blue-900 mb-2 uppercase text-[10px]">Local de Trabalho</label>
                <select id="localTrabalho" class="w-full p-3 rounded-xl border-none shadow-sm font-semibold text-slate-700">
                    <option value="emef">EMEF / EMEFM</option>
                    <option value="emei">EMEI / CEMEI</option>
                    <option value="cei">CEI</option>
                    <option value="cieja">CIEJA / CCI / CIP</option>
                    <option value="dre" selected>DRE / SME / GESTÃO CEU</option>
                </select>
            </div>
            <div>
                <label class="block font-bold text-blue-900 mb-2 uppercase text-[10px]">Jornada</label>
                <select id="jornada" class="w-full p-3 rounded-xl border-none shadow-sm font-semibold text-slate-700">
                    <option value="1.0">JEIF / JB 30 / JB 40 / JE 40 (100%)</option>
                    <option value="0.75">JBD (75%)</option>
                    <option value="0.5">JB Professor (50%)</option>
                </select>
            </div>
        </div>

        <!-- COMPLEXIDADE (ANEXO IV) -->
        <div id="complexidade_box" class="hidden bg-indigo-50 p-6 rounded-2xl mb-8 border border-indigo-100 shadow-sm">
            <label class="block font-bold text-indigo-900 mb-2 uppercase text-[10px] tracking-widest text-sm">Nível de Complexidade de G
